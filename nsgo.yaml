# icons 的 nsgo 工具配置（go tool nsgo dev / build 使用；
# 纯 go build 会忽略此文件）。
name: icons
id: limengwei.mindspace.icons
version: 1.2.0
copyright: © 2026 icons
appearance: dark

icon:
  windows: assets/IconWindows.png
  png: icon.png

dev:
  target: native

# 安装 <name>.com 控制台伴随程序并把安装目录加入用户 Path，
# 终端可直接运行 `icons --mcp`（stdio MCP 模式）
windows:
  command_line: true

# 发布仓库：构建附带 install.ps1 / install.sh 安装脚本
release:
  github: limengwei/icons

build:
  output: dist
  targets: [windows_x64]
